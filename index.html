<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG GAMER BOY FF — Login</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0b0b0e;
  --card:#15151a;
  --field:#0d0d10;
  --text:#f5f5f7;
  --muted:#9b9ba3;
  --line:#292930;
  --accent:#e52b3f;
  --accent2:#ff5363;
}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -10%,rgba(229,43,63,.25),transparent 38%),
    linear-gradient(180deg,#1a0b0e 0%,var(--bg) 30%,#070709 100%);
}
.topbar{
  height:7px;
  background:linear-gradient(90deg,#9e1525,var(--accent),#ff6977);
}
.wrap{
  width:min(94%,520px);
  margin:38px auto 28px;
}
.brand{
  text-align:center;
  margin-bottom:22px;
}
.logo{
  width:86px;height:86px;
  margin:0 auto 14px;
  border-radius:25px;
  display:grid;
  place-items:center;
  font-size:52px;
  font-weight:900;
  letter-spacing:-5px;
  color:white;
  background:linear-gradient(145deg,#1c1c22,#08080a);
  border:1px solid #36363e;
  box-shadow:0 18px 45px rgba(0,0,0,.45),0 0 35px rgba(229,43,63,.16);
}
h1{
  margin:0;
  font-size:29px;
  letter-spacing:.3px;
}
.brand p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:14px;
}
.card{
  background:rgba(21,21,26,.96);
  border:1px solid #303039;
  border-radius:25px;
  padding:27px 22px 24px;
  box-shadow:0 24px 70px rgba(0,0,0,.48);
}
.heading{
  padding:13px 15px;
  margin-bottom:23px;
  border-radius:12px;
  background:linear-gradient(90deg,rgba(229,43,63,.13),rgba(255,83,99,.05));
  border:1px solid rgba(229,43,63,.18);
  text-align:center;
  font-size:14px;
  color:#d9d9df;
}
.heading b{color:#ff5868}
label{
  display:block;
  margin:0 0 8px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.7px;
  color:#d8d8dd;
}
.field{margin-bottom:18px}
.input-wrap{position:relative}
input{
  width:100%;
  height:55px;
  border-radius:12px;
  border:1px solid var(--line);
  outline:none;
  background:var(--field);
  color:var(--text);
  padding:0 48px 0 16px;
  font-size:15px;
  transition:.2s ease;
}
input:focus{
  border-color:rgba(255,83,99,.75);
  box-shadow:0 0 0 3px rgba(229,43,63,.10);
}
input::placeholder{color:#707079}
.eye{
  position:absolute;
  right:10px;top:50%;
  transform:translateY(-50%);
  width:35px;height:35px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#9999a2;
  cursor:pointer;
  font-size:16px;
}
.eye:hover{background:#202027;color:white}
.login{
  width:100%;
  height:55px;
  border:0;
  border-radius:12px;
  color:white;
  font-weight:850;
  font-size:15px;
  letter-spacing:.5px;
  cursor:pointer;
  background:linear-gradient(135deg,#c91e32,var(--accent),var(--accent2));
  box-shadow:0 12px 28px rgba(229,43,63,.22);
}
.login:active{transform:translateY(1px)}
#profileBox{
  display:none;
  text-align:center;
  padding:8px 0 2px;
}
.profile-icon{
  width:82px;height:82px;margin:0 auto 14px;border-radius:50%;
  display:grid;place-items:center;position:relative;
  background:linear-gradient(145deg,#1c1c22,#08080a);
  border:1px solid #36363e;
  box-shadow:0 14px 35px rgba(0,0,0,.38),0 0 24px rgba(229,43,63,.14);
  font-size:31px;font-weight:900;
}
.profile-number{
  position:absolute;right:-8px;bottom:-2px;min-width:42px;height:25px;
  padding:0 8px;border-radius:999px;display:flex;align-items:center;
  justify-content:center;background:#15151a;border:1px solid #4a4a54;
  color:#fff;font-size:12px;font-weight:900;
}
.profile-username{font-size:19px;font-weight:850;color:#fff;word-break:break-word}
.profile-label{margin-top:5px;color:#8f8f98;font-size:12px}
.profile-enter{margin-top:20px}
.profile-logout{
  display:block;margin:13px auto 0;border:0;background:transparent;
  color:#777780;font-size:12px;cursor:pointer;
}
.profile-logout:hover{color:#cfcfd5}
#status{
  display:none;
  margin:0 0 18px;
  padding:12px 14px;
  border-radius:10px;
  font-size:13px;
  line-height:1.45;
  background:#211316;
  border:1px solid #52212a;
  color:#ffb0b8;
}
.note{
  margin-top:16px;
  text-align:center;
  color:#777780;
  font-size:12px;
  line-height:1.5;
}
footer{
  text-align:center;
  margin-top:20px;
  color:#676770;
  font-size:11px;
}
@media(max-width:420px){
  .wrap{margin-top:28px}
  .card{padding:23px 17px 21px}
  h1{font-size:26px}
}
</style>
</head>

<body>
<div class="topbar"></div>

<main class="wrap">
  <section class="brand">
    <div class="logo">R</div>
    <h1>RG GAMER BOY FF</h1>
    <p>Login to continue</p>
  </section>

  <section class="card">
    <div class="heading">
      Login with <b>username and password</b>
    </div>

    <div id="status"></div>

    <div id="profileBox">
      <div class="profile-icon">
        <span id="profileInitial">R</span>
        <span class="profile-number" id="profileNumber">#0</span>
      </div>
      <div class="profile-username" id="profileUsername"></div>
      <div class="profile-label">Your account profile</div>
      <button class="login profile-enter" id="enterButton" type="button">ENTER</button>
      <button class="profile-logout" id="logoutButton" type="button">Use another account</button>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">USERNAME</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          placeholder="Enter your username"
          maxlength="24"
          required
        >
      </div>

      <div class="field">
        <label for="password">PASSWORD</label>
        <div class="input-wrap">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >
          <button class="eye" type="button" data-target="password" aria-label="Show password">◉</button>
        </div>
      </div>

      <button class="login" type="submit">LOGIN</button>
    </form>

    <div class="note">
      Enter the username and password created from the account registration system.
    </div>
  </section>

  <footer>RG GAMER BOY FF • Account Login</footer>
</main>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyByc4PP-Tglp-Seynuu8CTllNiQ3PSa1E8",
    authDomain: "rg-gamer-boy-ff-store.firebaseapp.com",
    databaseURL: "https://rg-gamer-boy-ff-store-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "rg-gamer-boy-ff-store",
    storageBucket: "rg-gamer-boy-ff-store.firebasestorage.app",
    messagingSenderId: "1057271668760",
    appId: "1:1057271668760:web:cf404473d0ab32171c236d",
    measurementId: "G-YTXTLFW0NV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  window.RG_AUTH = {
    auth, db, ref, get,
    signInWithEmailAndPassword, onAuthStateChanged, signOut
  };
</script>

<script>
const form = document.getElementById("loginForm");
const statusBox = document.getElementById("status");
const profileBox = document.getElementById("profileBox");
const profileInitial = document.getElementById("profileInitial");
const profileNumber = document.getElementById("profileNumber");
const profileUsername = document.getElementById("profileUsername");
const enterButton = document.getElementById("enterButton");
const logoutButton = document.getElementById("logoutButton");

const TARGET_URL = "https://rggamerboyff01.github.io/RG-GAMER-BOY-FF-/";

function showStatus(message){
  statusBox.textContent = message;
  statusBox.style.display = "block";
}
function hideStatus(){ statusBox.style.display = "none"; }

function showLoginForm(){
  profileBox.style.display = "none";
  form.style.display = "block";
}
function showProfile(username, accountNumber){
  form.style.display = "none";
  hideStatus();

  const safeUsername = username || "User";
  const number = Number(accountNumber);

  profileUsername.textContent = safeUsername;
  profileInitial.textContent = safeUsername.charAt(0).toUpperCase();
  profileNumber.textContent =
    Number.isFinite(number) && number > 0 ? "#" + number : "#—";

  profileBox.style.display = "block";
}

document.querySelectorAll(".eye").forEach(btn => {
  btn.addEventListener("click", () => {
    const input = document.getElementById(btn.dataset.target);
    input.type = input.type === "password" ? "text" : "password";
    btn.textContent = input.type === "password" ? "◉" : "◎";
  });
});

enterButton.addEventListener("click", () => {
  window.location.href = TARGET_URL;
});

logoutButton.addEventListener("click", async () => {
  try{
    const { auth, signOut } = window.RG_AUTH;
    await signOut(auth);
    form.reset();
    showLoginForm();
    hideStatus();
  }catch(error){
    console.error("Logout failed:", error);
    showStatus("Could not switch account. Please try again.");
  }
});

async function loadProfile(user){
  try{
    const { db, ref, get } = window.RG_AUTH;
    const userSnap = await get(ref(db, "users/" + user.uid));

    if(!userSnap.exists()){
      showLoginForm();
      showStatus("Account profile was not found.");
      return;
    }

    const data = userSnap.val();
    showProfile(data.username || "User", data.accountNumber);
  }catch(error){
    console.error("Profile load failed:", error);
    showLoginForm();
    showStatus("Could not load your account profile.");
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  hideStatus();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if(!username || !password){
    showStatus("Please enter your username and password.");
    return;
  }
  if(username.length < 3){
    showStatus("Username or password incorrect.");
    return;
  }

  const loginBtn = form.querySelector(".login");
  loginBtn.disabled = true;
  loginBtn.textContent = "LOGGING IN...";

  try{
    const authEmail =
      username.toLowerCase() +
      "@users.rg-gamer-boy-ff-store.firebaseapp.com";

    const { auth, signInWithEmailAndPassword } = window.RG_AUTH;
    await signInWithEmailAndPassword(auth, authEmail, password);
    // The Firebase session is retained; the profile is shown automatically.
  }catch(error){
    console.error("Login failed:", error);
    showStatus("Username or password incorrect.");
    loginBtn.disabled = false;
    loginBtn.textContent = "LOGIN";
  }
});

const { auth, onAuthStateChanged } = window.RG_AUTH;

onAuthStateChanged(auth, (user) => {
  if(user){
    loadProfile(user);
  }else{
    showLoginForm();
  }
});
</script>
</body>
</html>
